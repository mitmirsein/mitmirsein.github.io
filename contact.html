<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>케리그마출판사 | 온라인 문의</title>
  <meta name="description" content="케리그마출판사 주간 신학 브리핑 및 출판 온라인 문의">
  <link rel="icon" href="https://img2.stibee.com/1b39642f-c7fb-4ad5-a9e8-d12144d4457a.png">
  <style>
    :root {
      --primary: #051c2c;
      --accent: #005a9c;
      --bg: #f4f5f7;
      --surface: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border: #dbe0e6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 40px 16px;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .contact-card {
      background: var(--surface);
      max-width: 580px;
      width: 100%;
      border-radius: 8px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(5, 28, 44, 0.06);
      overflow: hidden;
    }
    .card-header {
      background-color: var(--primary);
      color: #ffffff;
      padding: 36px 32px 28px 32px;
      text-align: center;
    }
    .brand-eyebrow {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #93c5fd;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .card-title {
      font-family: 'Georgia', 'Times New Roman', 'Noto Serif KR', serif;
      font-size: 24px;
      font-weight: 700;
      margin: 0 0 8px 0;
      letter-spacing: -0.02em;
    }
    .card-desc {
      font-size: 13.5px;
      color: #cbd5e1;
      margin: 0;
      line-height: 1.5;
    }
    .card-body {
      padding: 32px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 6px;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      border: 1px solid var(--border);
      border-radius: 4px;
      background-color: #ffffff;
      color: var(--text-main);
      transition: border-color 0.2s;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0, 90, 156, 0.1);
    }
    textarea {
      resize: vertical;
      min-height: 120px;
      line-height: 1.6;
    }
    .submit-btn {
      width: 100%;
      background-color: var(--primary);
      color: #ffffff;
      border: none;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 4px;
      cursor: pointer;
      transition: background-color 0.2s;
      letter-spacing: 0.01em;
    }
    .submit-btn:hover {
      background-color: #0c2d44;
    }
    .card-footer {
      background-color: #f8fafc;
      border-top: 1px solid var(--border);
      padding: 18px 32px;
      text-align: center;
      font-size: 12px;
      color: var(--text-muted);
    }
    .card-footer a {
      color: var(--accent);
      text-decoration: underline;
    }
    .success-message {
      display: none;
      padding: 24px;
      background-color: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 6px;
      text-align: center;
      color: #166534;
      font-size: 14.5px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <div class="card-header">
      <div class="brand-eyebrow">KERYGMA PUBLISHING</div>
      <h1 class="card-title">온라인 문의</h1>
      <p class="card-desc">주간 신학 브리핑 및 출판 관련 의견을 남겨주시면 신속히 확인 후 회신드리겠습니다.</p>
    </div>

    <div class="card-body">
      <div id="successBox" class="success-message">
        <strong>✅ 문의가 성공적으로 전송되었습니다.</strong><br>
        보내주신 소중한 메시지를 확인한 후 기재해주신 이메일(<span id="sentEmail"></span>)로 답변드리겠습니다.
      </div>

      <form id="contactForm" onsubmit="handleContactSubmit(event)">
        <div class="form-group">
          <label for="name">성함 / 연구자명 <span style="color: #ef4444;">*</span></label>
          <input type="text" id="name" name="name" required placeholder="홍길동">
        </div>

        <div class="form-group">
          <label for="email">이메일 주소 <span style="color: #ef4444;">*</span></label>
          <input type="email" id="email" name="email" required placeholder="example@domain.com">
        </div>

        <div class="form-group">
          <label for="category">문의 유형 <span style="color: #ef4444;">*</span></label>
          <select id="category" name="category" required>
            <option value="주간 신학 브리핑 피드백 및 제안">주간 신학 브리핑 피드백 및 제안</option>
            <option value="도서 출판 및 원고 투고 문의">도서 출판 및 원고 투고 문의</option>
            <option value="기타 일반 문의">기타 일반 문의</option>
          </select>
        </div>

        <div class="form-group">
          <label for="message">문의 내용 <span style="color: #ef4444;">*</span></label>
          <textarea id="message" name="message" required placeholder="문의하실 내용을 자유롭게 적어주세요."></textarea>
        </div>

        <button type="submit" id="submitBtn" class="submit-btn">문의 보내기</button>
      </form>
    </div>

    <div class="card-footer">
      <a href="https://kerygma.co.kr">케리그마출판사 메인으로 돌아가기</a>
      &nbsp;|&nbsp;
      <a href="https://kerygma.co.kr/subscribe.html">뉴스레터 구독/해지 관리</a>
    </div>
  </div>

  <script>
    async function handleContactSubmit(e) {
      e.preventDefault();
      const form = document.getElementById('contactForm');
      const btn = document.getElementById('submitBtn');
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const category = document.getElementById('category').value;
      const message = document.getElementById('message').value.trim();

      if (!name || !email || !message) return;

      btn.disabled = true;
      btn.innerText = "전송 중...";

      try {
        const response = await fetch("https://formsubmit.co/ajax/mitmirsein@gmail.com", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            "이름": name,
            "이메일": email,
            "문의유형": category,
            "문의내용": message,
            "_subject": `[케리그마 문의] ${name}님의 문의 (${category})`,
            "_replyto": email,
            "_cc": "kp@kerygma.co.kr",
            "_template": "table",
            "_captcha": "false"
          })
        });

        document.getElementById('sentEmail').innerText = email;
        form.style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      } catch (err) {
        // Fallback to mailto
        const subject = encodeURIComponent(`[케리그마 문의] ${name}님의 문의 (${category})`);
        const body = encodeURIComponent(`성함: ${name}\n이메일: ${email}\n문의유형: ${category}\n\n[문의내용]\n${message}`);
        window.location.href = `mailto:kp@kerygma.co.kr?subject=${subject}&body=${body}`;
        
        document.getElementById('sentEmail').innerText = email;
        form.style.display = 'none';
        document.getElementById('successBox').style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.innerText = "문의 보내기";
      }
    }
  </script>

</body>
</html>
