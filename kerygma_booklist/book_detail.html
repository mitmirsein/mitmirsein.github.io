<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>도서 상세 - Kerygma Library</title>
    <meta name="description" content="케리그마 출판사의 신학 도서 상세 정보. 깊이 있는 신학적 통찰과 영성을 만나보세요.">
    <meta property="og:title" content="Kerygma Library - 도서 상세">
    <meta property="og:description" content="케리그마 출판사의 신학 도서 상세 정보">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <!-- PortOne SDK (KG이니시스 결제용) -->
    <script src="https://cdn.portone.io/v2/browser-sdk.js"></script>
    <style>
        /* Page-specific: Noise Texture */
        body::before {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            content: "";
            opacity: 0.05;
            z-index: 50;
            pointer-events: none;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center py-12 px-4 sm:px-6 lg:px-8">

    <!-- Navigation -->
    <nav class="w-full max-w-6xl mb-12 flex items-center justify-between">
        <a href="library.html" class="text-slate-400 hover:text-white transition-colors flex items-center gap-2 text-sm uppercase tracking-widest font-bold group">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 transform group-hover:-translate-x-1 transition-transform" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
            </svg>
            Back to Library
        </a>
    </nav>

    <!-- Content Container -->
    <main id="bookContent" class="w-full max-w-6xl grid grid-cols-1 lg:grid-cols-12 gap-12 hidden opacity-0 transition-opacity duration-700 ease-out">
        
        <!-- Left Column: Cover & Sticky Actions -->
        <div class="lg:col-span-4 flex flex-col gap-8">
            <div class="sticky top-8">
                <!-- Cover -->
                <div class="relative mb-8">
                    <img id="bookCover" src="" alt="Book Cover" onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1544716278-ca5e3f4abd8c?w=600&auto=format&fit=crop&q=80';" class="w-full h-auto rounded-sm border border-white/10">
                </div>

                <!-- Status & Purchase -->
                <div class="flex flex-col gap-4">
                    <div class="flex justify-between items-center px-2">
                        <span class="text-slate-500 text-xs font-bold uppercase tracking-widest">Status</span>
                        <span id="bookStatusBadge" class="px-3 py-1 rounded-full text-xs font-medium border"></span>
                    </div>
                    
                    <div id="purchaseLinks" class="flex flex-col gap-3 mt-4">
                        <!-- Dynamic Buttons -->
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Rich Content -->
        <div class="lg:col-span-8 flex flex-col gap-12">
            
            <!-- Header Group -->
            <div class="border-b border-slate-800 pb-8">
                <div class="flex flex-wrap gap-2 mb-6" id="tagContainer"></div>
                <h1 id="bookTitle" class="text-4xl md:text-5xl font-bold text-white mb-3 tracking-tight leading-tight"></h1>
                <h2 id="bookSubtitle" class="text-xl md:text-2xl text-slate-400 font-light mb-8 font-serif italic leading-relaxed"></h2>
                
                <div class="flex flex-wrap items-center gap-4 text-sm text-slate-300">
                    <span class="flex items-center gap-2 px-4 py-2 bg-slate-800/50 rounded-full border border-slate-700/50 hover:bg-slate-800 transition-colors">
                        <svg class="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        <span id="bookAuthor" class="font-bold tracking-wide"></span>
                    </span>
                    <span class="flex items-center gap-2 px-4 py-2 bg-sky-500/10 text-sky-400 rounded-full border border-sky-500/30 font-bold">
                        <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <span>정가:</span>
                        <span id="bookPrice" class="text-white font-extrabold"></span>
                    </span>
                </div>
            </div>

            <!-- Quotes (Highlight) -->
            <div id="quotesSection" class="hidden">
                 <div class="relative pl-4">
                    <svg class="absolute -top-6 -left-2 w-16 h-16 text-blue-500/10 z-0 opacity-50" fill="currentColor" viewBox="0 0 24 24"><path d="M14.017 21L14.017 18C14.017 16.054 15.362 14.868 17.070 14.868C17.766 14.868 18.232 15.068 18.572 15.228C18.292 13.988 16.632 12.388 13.793 11.536L14.512 9.496C19.897 11.08 22 14.78 22 18.001L22 21L14.017 21ZM5 21L5 18C5 16.054 6.345 14.868 8.051 14.868C8.749 14.868 9.215 15.068 9.553 15.228C9.274 13.988 7.616 12.388 4.774 11.536L5.495 9.496C10.879 11.08 12.983 14.78 12.983 18.001L12.983 21L5 21Z"/></svg>
                    <div id="quotesContainer" class="space-y-6 relative z-10">
                        <!-- Quotes injected here -->
                    </div>
                </div>
            </div>

            <!-- Book Description -->
            <div>
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-6 border-l-2 border-slate-700 pl-3">About the Book</h3>
                <div id="bookDescription" class="prose max-w-none text-slate-300"></div>
            </div>

            <!-- Author Bio -->
            <div id="bioSection" class="bg-slate-900/40 p-8 rounded-xl border border-slate-800 hidden hover:border-slate-700 transition-colors">
                <h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-4 border-l-2 border-blue-500/50 pl-3">About the Author</h3>
                <div id="authorBio" class="text-slate-300 leading-relaxed font-serif text-lg"></div>
            </div>

        </div>
    </main>

    <!-- Error State -->
    <div id="errorState" class="hidden min-h-[50vh] flex flex-col items-center justify-center text-center">
        <h2 class="text-3xl font-bold text-slate-600 mb-4">404</h2>
        <p class="text-slate-400 mb-8">존재하지 않는 도서입니다.</p>
        <a href="library.html" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-lg text-white transition-colors">
            목록으로 돌아가기
        </a>
    </div>

    <!-- Direct Order Modal -->
    <div id="orderModal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-6 sm:p-8 max-w-lg w-full text-slate-200 relative shadow-2xl">
            <button onclick="closeOrderModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white text-xl font-bold cursor-pointer">&times;</button>
            
            <h3 id="orderBookTitle" class="text-xl font-bold text-white mb-1"></h3>
            <p class="text-sky-400 text-xs font-semibold mb-6">케리그마출판사 직영 주문 / 결제 신청</p>
            
            <form id="orderForm" onsubmit="handleOrderSubmit(event)" class="space-y-4 text-left">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">주문자 성함 *</label>
                    <input type="text" required id="orderName" placeholder="홍길동" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">연락처 (결제 및 배송 안내 SMS 수신) *</label>
                    <input type="tel" required id="orderPhone" placeholder="010-1234-5678" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">배송지 주소 *</label>
                    <input type="text" required id="orderAddress" placeholder="도로명 주소 및 상세 주소" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">결제 수단 선택 *</label>
                    <select id="orderPayMethod" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-sky-500">
                        <option value="inicis_card">신용/체크카드 (KG이니시스 전자결제)</option>
                        <option value="inicis_trans">실시간 계좌이체 (KG이니시스)</option>
                        <option value="inicis_vbank">가상계좌 (KG이니시스)</option>
                        <option value="bank">무통장 계좌 직접 입금</option>
                    </select>
                </div>
                
                <div class="pt-2">
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-bold rounded-lg transition-all shadow-lg shadow-amber-500/20 cursor-pointer flex items-center justify-center gap-2">
                        <span>도서 결제 및 주문하기</span>
                    </button>
                </div>
                <p class="text-[11px] text-slate-500 text-center">KG이니시스 안전 결제 시스템을 통해 결제가 진행됩니다.</p>
            </form>
            
            <div id="orderSuccessMsg" class="hidden text-center py-8">
                <div class="text-green-400 text-4xl mb-3">✓</div>
                <h4 class="text-lg font-bold text-white mb-2">주문/결제가 성공적으로 접수되었습니다!</h4>
                <p id="orderSuccessDetail" class="text-slate-300 text-sm mb-6">입력하신 연락처로 배송 안내 문자를 발송해 드립니다.</p>
                <button onclick="closeOrderModal()" class="px-6 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-bold cursor-pointer">닫기</button>
            </div>
        </div>
    </div>

    <script type="module">
        import libraryData from './library_data.js?v=20260820';

        const PORTONE_STORE_ID = "store-0dc3275e-5581-4ce0-bca1-0eca673d768c";
        const CHANNEL_KEYS = {
            "html5_inicis": "channel-key-8118f6e6-706b-4669-a522-45b94bc06767"
        };

        let currentBook = null;

        window.openOrderModal = (title) => {
            document.getElementById('orderBookTitle').innerText = title || (currentBook ? currentBook.title : '도서 주문 신청');
            document.getElementById('orderForm').classList.remove('hidden');
            document.getElementById('orderSuccessMsg').classList.add('hidden');
            document.getElementById('orderModal').classList.remove('hidden');
            document.getElementById('orderModal').classList.add('flex');
        };

        window.closeOrderModal = () => {
            document.getElementById('orderModal').classList.add('hidden');
            document.getElementById('orderModal').classList.remove('flex');
        };

        window.handleOrderSubmit = async (e) => {
            e.preventDefault();
            const submitBtn = e.target.querySelector('button[type="submit"]');
            const originalText = submitBtn ? submitBtn.innerHTML : "도서 결제 및 주문하기";

            const name = document.getElementById('orderName').value.trim();
            const phone = document.getElementById('orderPhone').value.trim();
            const address = document.getElementById('orderAddress').value.trim();
            const payMethod = document.getElementById('orderPayMethod').value;
            const bookTitle = document.getElementById('orderBookTitle').innerText;

            let priceNum = 17000;
            if (currentBook && currentBook.price) {
                const parsed = parseInt(currentBook.price.replace(/[^0-9]/g, ''), 10);
                if (parsed > 0) priceNum = parsed;
            }

            if (payMethod.startsWith('inicis_')) {
                const methodMap = {
                    "inicis_card": "CARD",
                    "inicis_trans": "TRANSFER",
                    "inicis_vbank": "VIRTUAL_ACCOUNT"
                };
                const v2Method = methodMap[payMethod] || "CARD";
                const paymentId = 'kerygma_order_' + new Date().getTime();

                if (typeof PortOne !== "undefined") {
                    if (submitBtn) {
                        submitBtn.innerText = "결제창 호출 중...";
                        submitBtn.disabled = true;
                    }
                    try {
                        const response = await PortOne.requestPayment({
                            storeId: PORTONE_STORE_ID,
                            channelKey: CHANNEL_KEYS["html5_inicis"],
                            paymentId: paymentId,
                            orderName: bookTitle,
                            totalAmount: priceNum,
                            currency: "CURRENCY_KRW",
                            payMethod: v2Method,
                            customer: {
                                fullName: name,
                                phoneNumber: phone,
                                email: "kp@kerygma.co.kr",
                                address: {
                                    addressLine1: address,
                                    addressLine2: ""
                                }
                            },
                            redirectUrl: window.location.href
                        });

                        if (response && response.code != null) {
                            alert("⚠️ [결제 취소/실패]\n\n• 사유: " + (response.message || "사용자 결제 취소"));
                            if (submitBtn) {
                                submitBtn.innerHTML = originalText;
                                submitBtn.disabled = false;
                            }
                            return;
                        }
                    } catch (err) {
                        console.error("PortOne Error:", err);
                        alert("⚠️ [결제 오류]: " + (err.message || JSON.stringify(err)));
                        if (submitBtn) {
                            submitBtn.innerHTML = originalText;
                            submitBtn.disabled = false;
                        }
                        return;
                    }
                }
            }

            if (submitBtn) {
                submitBtn.innerText = "주문 접수 중...";
                submitBtn.disabled = true;
            }

            try {
                await fetch("https://formsubmit.co/ajax/c569f1de951158eea6d96c242347861d", {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        _subject: `[케리그마 도서결제/주문] ${bookTitle} - ${name}님`,
                        "도서명": bookTitle,
                        "결제금액": priceNum + "원",
                        "주문자성함": name,
                        "연락처": phone,
                        "배송지주소": address,
                        "결제수단": payMethod
                    })
                });
            } catch (err) {
                console.error("Order notification error:", err);
            }

            if (submitBtn) {
                submitBtn.innerHTML = originalText;
                submitBtn.disabled = false;
            }
            document.getElementById('orderForm').classList.add('hidden');
            document.getElementById('orderSuccessDetail').innerText = `${bookTitle} (${priceNum.toLocaleString()}원) 결제/주문이 완료되었습니다.`;
            document.getElementById('orderSuccessMsg').classList.remove('hidden');
        };

        const urlParams = new URLSearchParams(window.location.search);
        const bookId = urlParams.get('id');
        const book = libraryData.find(b => b.id === bookId);
        currentBook = book;

        if (!book) {
            document.getElementById('errorState').classList.remove('hidden');
        } else {
            const content = document.getElementById('bookContent');
            
            // Status Logic
            let statusText = book.status;
            let statusClass = "bg-slate-500/20 text-slate-400 border-slate-500/30"; 
            
            const normalizedStatus = (book.status || '').toLowerCase();
            if (normalizedStatus.includes('published') || normalizedStatus.includes('판매')) {
                statusText = '판매중';
                statusClass = "bg-green-500/10 text-green-400 border-green-500/20";
            } else if (normalizedStatus.includes('hived') || normalizedStatus.includes('out') || normalizedStatus.includes('절판')) {
                statusText = '절판';
                statusClass = "bg-red-500/10 text-red-400 border-red-500/20";
            } else if (normalizedStatus.includes('print') || normalizedStatus.includes('준비')) {
                statusText = '재쇄 준비중';
                statusClass = "bg-orange-500/10 text-orange-400 border-orange-500/20";
            }

            const badge = document.getElementById('bookStatusBadge');
            badge.innerText = statusText;
            badge.className = `px-3 py-1 rounded-sm text-xs font-bold uppercase tracking-widest border ${statusClass}`;

            // Basic Info
            document.title = `${book.title} - Kerygma Library`;
            document.getElementById('bookCover').src = book.cover || 'https://via.placeholder.com/300x450?text=No+Cover';
            
            document.getElementById('bookTitle').innerText = book.title;
            document.getElementById('bookSubtitle').innerText = book.subtitle || '';
            document.getElementById('bookAuthor').innerText = book.author;
            document.getElementById('bookPrice').innerText = book.price || '18,000원';

            const tagContainer = document.getElementById('tagContainer');
            if(book.tags) {
                book.tags.forEach(tag => {
                    const span = document.createElement('span');
                    span.className = "px-2 py-1 text-[10px] font-bold uppercase tracking-widest text-slate-400 border border-slate-700 rounded-sm";
                    span.innerText = `${tag}`;
                    tagContainer.appendChild(span);
                });
            }

            // Purchase Links
            const linkContainer = document.getElementById('purchaseLinks');

            // Direct Order Button (Publisher Direct)
            const directBtn = document.createElement('button');
            directBtn.type = "button";
            directBtn.onclick = () => window.openOrderModal(book.title);
            directBtn.className = "block w-full text-center py-3.5 rounded-md text-sm font-bold bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 transition-all duration-300 flex items-center justify-center gap-2 shadow-lg shadow-amber-500/20 mb-2 border border-amber-400/40 cursor-pointer";
            directBtn.innerHTML = `<span>출판사 직영 온라인 주문 / 결제</span> <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 100 4 2 2 0 000-4z"></path></svg>`;
            linkContainer.appendChild(directBtn);

            if (book.links && Array.isArray(book.links) && book.links.length > 0) {
                book.links.forEach(linkObj => {
                    const btn = document.createElement('a');
                    btn.href = linkObj.url;
                    btn.target = "_blank";
                    
                    // Unified styling for all buttons
                    let bgClass = "bg-slate-800 hover:bg-slate-700 border-white/10 text-slate-300";

                    btn.className = `block w-full text-center py-3 rounded-md text-sm font-bold transition-all duration-300 border ${bgClass} text-slate-300 flex items-center justify-center gap-2 shadow-lg`;
                    
                    btn.innerHTML = `<span>${linkObj.site}</span> <svg class="w-3 h-3 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>`;
                    linkContainer.appendChild(btn);
                });
            } else if (book.link) {
                const btn = document.createElement('a');
                btn.href = book.link;
                btn.target = "_blank";
                btn.className = "block w-full text-center py-3 rounded-md font-bold bg-blue-600 hover:bg-blue-500 text-white transition-all shadow-lg shadow-blue-900/20";
                btn.innerText = "구매 페이지로 이동";
                linkContainer.appendChild(btn);
            }

            // Description
            document.getElementById('bookDescription').innerHTML = book.long_desc || book.desc || "<p class='text-slate-500 italic'>상세 소개가 준비 중입니다.</p>";

            // Quotes
            if (book.quotes && book.quotes.length > 0) {
                const qSection = document.getElementById('quotesSection');
                const qContainer = document.getElementById('quotesContainer');
                qSection.classList.remove('hidden');
                book.quotes.forEach(q => {
                    const div = document.createElement('div');
                    div.className = "quote-card p-6 rounded-lg shadow-xl hover:translate-x-1 transition-transform duration-300";
                    div.innerHTML = `
                        <p class="text-xl text-slate-200 italic leading-relaxed mb-4">"${q.text}"</p>
                        <p class="text-right text-sm text-sky-400 font-bold uppercase tracking-widest">— ${q.cite}</p>
                    `;
                    qContainer.appendChild(div);
                });
            }

            // Bio
            if (book.author_bio) {
                document.getElementById('bioSection').classList.remove('hidden');
                document.getElementById('authorBio').innerHTML = book.author_bio;
            }

            // Reveal
            content.classList.remove('hidden');
            setTimeout(() => content.classList.remove('opacity-0'), 100);
        }
    </script>
</body>
</html>
