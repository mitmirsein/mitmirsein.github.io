<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KERYGMA Library</title>
    <meta name="description" content="케리그마 출판사의 신학 도서 라이브러리. 교리사, 조직신학, 설교, 묵상 등 깊이 있는 신학 서적을 만나보세요.">
    <meta property="og:title" content="KERYGMA Library - 케리그마 출판 도서">
    <meta property="og:description" content="깊이 있는 신학적 통찰과 영성을 만나보세요.">
    <meta property="og:type" content="website">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Noto+Serif+KR:wght@300;400;600;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen">
    <!-- Navbar -->
    <nav class="fixed top-0 w-full z-50 glass-panel border-b-0 border-b-white/5">
        <div class="max-w-7xl mx-auto px-6 h-16 flex items-center justify-between">
            <a href="https://kerygma.co.kr/kerygma_booklist/library.html" class="flex items-center gap-2 text-white font-black tracking-tighter text-xl">
                <i data-lucide="library" class="w-5 h-5 text-sky-500"></i>
                KERYGMA <span class="text-sky-500 font-light">BOOKLIST</span>
            </a>
            <div class="flex gap-4">
                <input type="text" id="searchInput" placeholder="Search titles, authors..." 
                       class="bg-slate-900/50 border border-slate-700 rounded-full px-4 py-1.5 text-xs focus:outline-none focus:border-sky-500 w-64 text-slate-300 transition-all">
            </div>
        </div>
    </nav>

    <div class="pt-24 pb-20 px-6 max-w-7xl mx-auto">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
            <div>
                <h1 class="text-4xl md:text-5xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400 neon-text mb-2">
                    케리그마 출판 도서
                </h1>
                <p class="text-slate-400 text-lg">깊이 있는 신학적 통찰과 영성을 만나보세요.</p>
            </div>
            
            <!-- Filters & Sort -->
            <div class="mt-8 flex flex-col sm:flex-row justify-center items-center gap-4">
                <div class="flex justify-center gap-2 flex-wrap" id="filterContainer">
                    <button onclick="filterBooks('all')" class="filter-btn active px-4 py-2 rounded-full border border-sky-500/30 bg-sky-500/10 text-sky-400 text-sm font-medium transition-all hover:bg-sky-500/20 shadow-[0_0_15px_rgba(14,165,233,0.3)]">전체</button>
                    <button onclick="filterBooks('판매중')" class="filter-btn px-4 py-2 rounded-full border border-slate-700 bg-slate-800/50 text-slate-400 text-sm font-medium transition-all hover:border-sky-500/50 hover:text-sky-400">판매중</button>
                    <button onclick="filterBooks('재쇄 준비중')" class="filter-btn px-4 py-2 rounded-full border border-slate-700 bg-slate-800/50 text-slate-400 text-sm font-medium transition-all hover:border-sky-500/50 hover:text-sky-400">재쇄 준비중</button>
                    <button onclick="filterBooks('절판')" class="filter-btn px-4 py-2 rounded-full border border-slate-700 bg-slate-800/50 text-slate-400 text-sm font-medium transition-all hover:border-sky-500/50 hover:text-sky-400">절판</button>
                </div>
                <select id="sortSelect" class="bg-slate-900/80 border border-slate-700 rounded-full px-4 py-2 text-sm text-slate-300 cursor-pointer focus:outline-none focus:border-sky-500 transition-colors">
                    <option value="id">기본순</option>
                    <option value="title">제목순</option>
                    <option value="author">저자순</option>
                </select>
            </div>
        </header>

        <!-- Book Grid -->
        <div id="bookGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <!-- Books will be injected here -->
        </div>
    </div>

    <script type="module">
        import libraryData from './library_data.js';
        lucide.createIcons();

        const bookGrid = document.getElementById('bookGrid');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');

        // State
        let currentFilter = 'all';
        let currentSort = 'id';

        // Read URL params on load
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('status')) {
            currentFilter = urlParams.get('status');
        }
        if (urlParams.get('sort')) {
            currentSort = urlParams.get('sort');
            sortSelect.value = currentSort;
        }

        // Update URL without reload
        function updateURL() {
            const params = new URLSearchParams();
            if (currentFilter !== 'all') params.set('status', currentFilter);
            if (currentSort !== 'id') params.set('sort', currentSort);
            const newURL = params.toString() ? `?${params.toString()}` : window.location.pathname;
            window.history.replaceState({}, '', newURL);
        }

        // Sort function
        function sortBooks(books) {
            const sorted = [...books];
            switch (currentSort) {
                case 'title':
                    sorted.sort((a, b) => a.title.localeCompare(b.title, 'ko'));
                    break;
                case 'author':
                    sorted.sort((a, b) => a.author.localeCompare(b.author, 'ko'));
                    break;
                default: // 'id' - original order (supports alphanumeric like 3b)
                    sorted.sort((a, b) => a.id.localeCompare(b.id, undefined, { numeric: true }));
            }
            return sorted;
        }

        // Render Books with animation
        function renderBooks(books) {
            bookGrid.innerHTML = '';
            
            if (books.length === 0) {
                bookGrid.innerHTML = '<div class="col-span-full text-center text-slate-500 py-20">검색 결과가 없습니다.</div>';
                return;
            }

            const sortedBooks = sortBooks(books);

            sortedBooks.forEach((book, index) => {
                let statusBadge = '';
                const s = (book.status || '').toLowerCase();
                if (s.includes('판매') || s.includes('published') || s === 'published') {
                    statusBadge = '<span class="absolute top-3 right-3 status-badge status-available">판매중</span>';
                } else if (s.includes('절판') || s.includes('archived')) {
                    statusBadge = '<span class="absolute top-3 right-3 status-badge status-archived">절판</span>';
                } else if (s.includes('재쇄') || s.includes('준비')) {
                    statusBadge = '<span class="absolute top-3 right-3 status-badge status-reprint">재쇄준비중</span>';
                }

                const card = document.createElement('div');
                card.className = 'book-card group relative bg-slate-900 border border-slate-800 rounded-xl overflow-hidden cursor-pointer h-full flex flex-col hover:border-slate-600 transition-colors';
                card.style.setProperty('--card-index', index);
                card.onclick = () => window.location.href = `book_detail.html?id=${book.id}`;
                
                const coverImg = book.cover && !book.cover.startsWith('http') 
                    ? book.cover
                    : (book.cover || 'https://via.placeholder.com/300x450?text=No+Cover');

                card.innerHTML = `
                    <div class="relative aspect-[2/3] overflow-hidden bg-slate-950">
                        <img src="${coverImg}" alt="${book.title}" class="book-cover w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-transform duration-500">
                        <div class="absolute inset-0 bg-gradient-to-t from-slate-900 via-transparent to-transparent opacity-60"></div>
                        ${statusBadge}
                    </div>
                    <div class="p-5 flex flex-col flex-grow relative">
                        <div class="mb-2 flex flex-wrap gap-1.5">
                            ${(book.tags || []).slice(0,2).map(tag => `<span class="tag-pill">#${tag}</span>`).join('')}
                        </div>
                        <h3 class="text-lg font-bold text-white mb-2 leading-snug group-hover:text-sky-400 transition-colors line-clamp-2 font-serif">${book.title}</h3>
                        <p class="text-slate-400 text-sm mb-4 line-clamp-1 border-t border-slate-800 pt-3 mt-auto">${book.author}</p>
                    </div>
                `;
                bookGrid.appendChild(card);
            });
        }

        // Filter function
        function filterData() {
            return libraryData.filter(book => {
                const s = (book.status || '').toLowerCase();
                if (currentFilter === 'all') return true;
                if (currentFilter === '판매중') return s.includes('판매') || s === 'published';
                if (currentFilter === '절판') return s.includes('절판') || s === 'archived' || s === 'out_of_print';
                if (currentFilter === '재쇄 준비중') return s.includes('재쇄') || s.includes('준비') || s === 'reprint_ready';
                return false;
            });
        }

        // Update filter button UI
        function updateFilterUI() {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                const txt = btn.innerText.trim();
                let active = false;
                if (currentFilter === 'all' && txt === '전체') active = true;
                if (currentFilter === '판매중' && txt === '판매중') active = true;
                if (currentFilter === '절판' && txt === '절판') active = true;
                if (currentFilter === '재쇄 준비중' && txt === '재쇄 준비중') active = true;

                if (active) {
                    btn.className = "filter-btn active px-4 py-2 rounded-full border border-sky-500/30 bg-sky-500/10 text-sky-400 text-sm font-medium transition-all shadow-[0_0_15px_rgba(14,165,233,0.3)]";
                } else {
                    btn.className = "filter-btn px-4 py-2 rounded-full border border-slate-700 bg-slate-800/50 text-slate-400 text-sm font-medium transition-all hover:border-sky-500/50 hover:text-sky-400";
                }
            });
        }

        // Filter handler (called from HTML onclick)
        window.filterBooks = (cat) => {
            currentFilter = cat;
            updateFilterUI();
            updateURL();
            renderBooks(filterData());
        };

        // Sort handler
        sortSelect.addEventListener('change', (e) => {
            currentSort = e.target.value;
            updateURL();
            renderBooks(filterData());
        });

        // Search handler
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = libraryData.filter(book => 
                book.title.toLowerCase().includes(term) || 
                book.author.toLowerCase().includes(term) ||
                (book.tags && book.tags.some(t => t.toLowerCase().includes(term)))
            );
            renderBooks(filtered);
        });

        // Init
        updateFilterUI();
        renderBooks(filterData());
    <!-- FOOTER -->
    <footer style="text-align: center; color: #94a3b8; padding: 50px 24px; font-family: 'Noto Sans KR', sans-serif; font-size: 0.8rem; line-height: 1.8; border-top: 1px solid rgba(255,255,255,0.08); margin-top: 60px; background: rgba(15, 23, 42, 0.8);">
        <div style="max-width: 900px; margin: 0 auto; opacity: 0.85;">
            <p style="margin-bottom: 6px; font-weight: 500; color: #f8fafc;">
                상호명: 케리그마출판사 &nbsp;|&nbsp; 대표자: 나명석 &nbsp;|&nbsp; 사업자등록번호: 110-92-08610 (면세사업자)
            </p>
            <p style="margin-bottom: 6px;">
                주소: 경기도 용인시 기흥구 연원로 49 (보정동) &nbsp;|&nbsp; 이메일: mitmirsein@gmail.com
            </p>
            <p style="margin-bottom: 12px; font-size: 0.75rem; color: #cbd5e1;">
                통신판매업신고: 면제 대상 (소규모·면세사업자) &nbsp;|&nbsp; 
                <a href="javascript:void(0)" onclick="openTermsModal('shipping')" style="color: #38bdf8; text-decoration: underline;">배송 및 교환/환불 규정</a> &nbsp;|&nbsp;
                <a href="javascript:void(0)" onclick="openTermsModal('terms')" style="color: #cbd5e1; text-decoration: underline;">이용약관</a> &nbsp;|&nbsp;
                <a href="javascript:void(0)" onclick="openTermsModal('privacy')" style="color: #cbd5e1; text-decoration: underline;">개인정보처리방침</a>
            </p>
            <p style="font-family: 'Outfit', sans-serif; font-size: 0.75rem; letter-spacing: 0.1em; opacity: 0.6; margin-top: 16px;">
                KERYGMA PRESS © 2011 • SOLI DEO GLORIA
            </p>
        </div>
    </footer>

    <!-- TERMS & POLICY MODAL -->
    <div id="termsModal" style="display: none; position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 20px;">
        <div style="background: #1e293b; color: #f8fafc; max-width: 650px; width: 100%; max-height: 80vh; overflow-y: auto; padding: 30px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); position: relative; font-family: 'Noto Sans KR', sans-serif; line-height: 1.7; font-size: 0.9rem; text-align: left;">
            <button onclick="closeTermsModal()" style="position: absolute; top: 15px; right: 20px; background: none; border: none; color: #94a3b8; font-size: 1.5rem; cursor: pointer;">&times;</button>
            <div id="modalTitle" style="font-size: 1.3rem; font-weight: 700; color: #38bdf8; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px;"></div>
            <div id="modalBody"></div>
            <div style="text-align: right; margin-top: 25px;">
                <button onclick="closeTermsModal()" style="background: #38bdf8; color: #0f172a; border: none; padding: 8px 20px; font-weight: 600; border-radius: 6px; cursor: pointer;">닫기</button>
            </div>
        </div>
    </div>

    <script>
        const modalContents = {
            shipping: {
                title: "배송 및 교환/환불 규정",
                body: `
                    <h4 style="color:#38bdf8; margin-bottom:8px;">1. 배송 안내</h4>
                    <p style="margin-bottom:14px; color:#cbd5e1;">
                        • 배송 방법: 우체국택배 (또는 지정 택배사)<br>
                        • 배송 지역: 대한민국 전국 (제주 및 도서산간 포함)<br>
                        • 배송 기간: 결제 완료 확인 후 영업일 기준 1~3일 이내 발송 (주말/공휴일 제외)<br>
                        • 기본 배송비: 3,000원
                    </p>
                    <h4 style="color:#38bdf8; margin-bottom:8px;">2. 교환 및 환불 안내</h4>
                    <p style="margin-bottom:14px; color:#cbd5e1;">
                        • 반품/교환 신청: 도서 수령 후 7일 이내 신청 가능합니다.<br>
                        • 파본(파손/인쇄/제본 불량) 또는 오배송의 경우 왕복 배송비 전액을 판매자가 부담합니다.<br>
                        • 단순 변심에 의한 교환/반품 시 왕복 배송비는 구매자가 부담합니다.
                    </p>
                    <h4 style="color:#38bdf8; margin-bottom:8px;">3. 교환/환불 불가 사유</h4>
                    <p style="color:#cbd5e1;">
                        • 수령 후 7일이 경과한 경우<br>
                        • 구매자의 귀책으로 도서가 훼손, 오염, 낙서 등으로 상품 가치가 상실된 경우<br>
                        • 디지털 콘텐츠/전자책(eBook)을 다운로드했거나 열람한 경우
                    </p>
                `
            },
            terms: {
                title: "서비스 이용약관",
                body: `
                    <p style="margin-bottom:12px; color:#cbd5e1;">
                        본 약관은 케리그마출판사(이하 "회사")가 제공하는 온라인 서비스 및 도서 판매 서비스의 이용조건과 절차에 관한 사항을 규정합니다.
                    </p>
                    <p style="margin-bottom:12px; color:#cbd5e1;">
                        1. 이용자는 회사가 제공하는 서비스를 법령 및 본 약관에 따라 성실히 이용하여야 합니다.<br>
                        2. 회사는 서비스 제공과 관련하여 수집된 개인정보를 이용자의 동의 없이 제3자에게 제공하지 않습니다.<br>
                        3. 도서 결제 및 배송에 관한 사항은 관계 법령(전자상거래 등에서의 소비자보호에 관한 법률)을 준수합니다.
                    </p>
                `
            },
            privacy: {
                title: "개인정보처리방침",
                body: `
                    <p style="margin-bottom:12px; color:#cbd5e1;">
                        케리그마출판사는 이용자의 개인정보를 중요시하며 "개인정보 보호법"을 준수합니다.
                    </p>
                    <p style="margin-bottom:12px; color:#cbd5e1;">
                        • 수집 항목: 성명, 연락처, 배송지 주소, 이메일 주소, 결제 기록<br>
                        • 수집 목적: 도서 주문 처리, 배송 서비스 제공, 대금 결제 및 상담 처리<br>
                        • 보유 및 이용 기간: 목적 달성 후 즉시 파기 (단, 관계 법령 보존 의무 기간 동안 보관)
                    </p>
                `
            }
        };

        function openTermsModal(type) {
            const data = modalContents[type];
            if (!data) return;
            document.getElementById('modalTitle').innerText = data.title;
            document.getElementById('modalBody').innerHTML = data.body;
            document.getElementById('termsModal').style.display = 'flex';
        }

        function closeTermsModal() {
            document.getElementById('termsModal').style.display = 'none';
        }
    </script>
</body>
</html>
